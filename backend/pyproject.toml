[project]
name = "research-development-workbench"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

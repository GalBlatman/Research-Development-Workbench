name: Foundation and domain checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: node scripts/check.mjs
      - run: node scripts/publication-guard.mjs --tracked
  domain-policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: rdw_test
          POSTGRES_PASSWORD: rdw_test
          POSTGRES_DB: rdw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RDW_TEST_POSTGRES_DSN: postgresql://rdw_test:rdw_test@127.0.0.1:5432/rdw_test
      RDW_REQUIRE_POSTGRES: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: backend/.python-version
      - run: python -m pip install uv==0.12.22
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy domain policy_engine persistence services model_adapters api
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: backend/.python-version
      - run: python -m pip install uv==0.12.22
      - run: uv sync --locked --directory backend
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: uv run --locked python -m api.contracts --check
        working-directory: backend
      - run: pnpm contracts && git diff --exit-code -- generated/api.ts
        working-directory: frontend
      - run: pnpm format:check
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
